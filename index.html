<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b9e5a" />
    <title>CNH Quest</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // aplica o tema e a letra salvos antes do primeiro desenho (evita piscar claro)
      try {
        var pr = JSON.parse(localStorage.getItem('cnhquest:progress:v1') || '{}').prefs || {};
        if (pr.theme === 'light' || pr.theme === 'dark') document.documentElement.setAttribute('data-theme', pr.theme);
        if (pr.bigText) document.documentElement.setAttribute('data-text', 'big');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
